<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT QR Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .qr-code {
            margin: 20px 0;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            margin: 10px 0;
        }
        .info {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thông tin kết nối MQTT</h1>
        <p>Quét mã QR bên dưới để lấy thông tin kết nối:</p>
        <div class="qr-code">
            <img src="data:image/png;base64,{{ qr_image }}" alt="MQTT QR Code">
        </div>
        <div class="info">
            <p>Broker: {{ broker }}</p>
            <p>Port: {{ port }}</p>
            <p>Topic: {{ topic }}</p>
        </div>
    </div>
</body>
</html>
